<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作業タイムトラッカー</title>
  <style>
    /* =========================================
       テーマ・変数定義
       ========================================= */
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #cbd5e1;
      
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #10b981;
      --success-hover: #059669;
      --success-bg: #ecfdf5;
      --warning: #f59e0b;
      --warning-hover: #d97706;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --danger-bg: #fef2f2;
      
      --btn-secondary: #e2e8f0;
      --btn-secondary-hover: #cbd5e1;
      --btn-secondary-text: #334155;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
    }

    [data-theme="dark"] {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --danger-bg: rgba(239, 68, 68, 0.1);
      
      --btn-secondary: #334155;
      --btn-secondary-hover: #475569;
      --btn-secondary-text: #e2e8f0;
      
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.5);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
    }

    /* =========================================
       ベーススタイル
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-container {
      width: 100%;
      max-width: 768px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input {
      font-family: var(--font-family);
    }

    /* =========================================
       ヘッダー周り
       ========================================= */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    .theme-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.25rem;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }
    
    .theme-toggle:active {
      transform: scale(0.95);
    }

    /* =========================================
       サマリー（合計時間）
       ========================================= */
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-md);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .summary-label {
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .summary-time {
      font-size: 2.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--primary);
      letter-spacing: -1px;
    }

    /* =========================================
       ツールバー（ボタン＆オプション）
       ========================================= */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 4px;
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: var(--radius-md);
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      user-select: none;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary { background-color: var(--primary); color: #fff; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    
    .btn-dark { background-color: #0f172a; color: #fff; }
    [data-theme="dark"] .btn-dark { background-color: #334155; }
    .btn-dark:hover { opacity: 0.9; }

    .toggle-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      background: var(--card-bg);
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    
    .toggle-option input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    /* =========================================
       タスクリスト
       ========================================= */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    /* 計測中のスタイル */
    .task-card.is-running {
      border-color: var(--success);
      background-color: var(--success-bg);
      box-shadow: 0 0 0 1px var(--success), var(--shadow-sm);
    }

    .task-card.is-running::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background-color: var(--success);
      border-radius: var(--radius-lg) 0 0 var(--radius-lg);
    }

    /* 上段：名前とタイマー操作 */
    .task-row-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-task-name {
      flex: 1;
      min-width: 150px;
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      background: transparent;
      color: var(--text-main);
      transition: all 0.2s ease;
    }

    .input-task-name:focus {
      outline: none;
      background: var(--bg-color);
      border-color: var(--primary);
    }

    .timer-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-display {
      font-size: 1.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      min-width: 95px;
      text-align: right;
      letter-spacing: -0.5px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: background-color 0.2s;
    }
    
    .time-display:hover {
      background-color: var(--btn-secondary);
    }

    .task-card.is-running .time-display {
      color: var(--success);
    }

    /* ステータスバッジ（パルスアニメーション） */
    .running-badge {
      display: none;
      align-items: center;
      gap: 6px;
      color: var(--success);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(16, 185, 129, 0.15);
    }

    .task-card.is-running .running-badge {
      display: inline-flex;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--success);
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.8); opacity: 0.5; }
    }

    /* 再生・停止ボタン */
    .btn-start { background-color: var(--success); color: white; }
    .btn-start:not(:disabled):hover { background-color: var(--success-hover); }
    
    .btn-stop { background-color: var(--warning); color: white; }
    .btn-stop:not(:disabled):hover { background-color: var(--warning-hover); }
    
    .btn-start:disabled, .btn-stop:disabled {
      background-color: var(--btn-secondary);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* 下段：メモと編集・削除操作 */
    .task-row-sub {
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px dashed var(--border-color);
      padding-top: 12px;
    }

    .input-task-memo {
      flex: 1;
      font-size: 0.95rem;
      color: var(--text-main);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      resize: vertical;
      min-height: 40px;
      transition: all 0.2s ease;
    }

    .input-task-memo:focus {
      outline: none;
      background: var(--bg-color);
      border-color: var(--primary);
    }

    .task-actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      background: var(--btn-secondary);
      color: var(--btn-secondary-text);
      padding: 8px;
      font-size: 1rem;
      border-radius: var(--radius-sm);
    }
    .btn-icon:hover { background: var(--btn-secondary-hover); }
    
    .btn-icon.danger { color: var(--danger); background: transparent; }
    .btn-icon.danger:hover { background: var(--danger-bg); }

    /* =========================================
       モーダル (時間編集)
       ========================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      z-index: 100;
      transition: opacity 0.2s ease;
      backdrop-filter: blur(2px);
    }
    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 24px;
      transform: translateY(20px);
      transition: transform 0.2s ease;
    }
    .modal-overlay.show .modal-content {
      transform: translateY(0);
    }

    .modal-header {
      font-weight: 700;
      font-size: 1.2rem;
      text-align: center;
      color: var(--text-main);
    }
    
    .time-edit-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .time-input-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .time-input-wrap label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .time-edit-group input {
      width: 70px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      padding: 10px 0;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-color);
      color: var(--text-main);
      transition: border-color 0.2s;
    }
    
    .time-edit-group input:focus {
      outline: none;
      border-color: var(--primary);
    }
    
    .time-edit-separator {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-top: 20px; /* inputの高さと合わせる調整 */
    }

    .modal-footer {
      display: flex;
      gap: 12px;
    }
    .modal-footer button { flex: 1; }
    
    .btn-cancel {
      background: var(--btn-secondary);
      color: var(--btn-secondary-text);
    }
    .btn-cancel:hover {
      background: var(--btn-secondary-hover);
    }

    /* =========================================
       トースト通知
       ========================================= */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 100px);
      background: #0f172a;
      color: #fff;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
      z-index: 200;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    [data-theme="dark"] .toast-container {
      background: #f8fafc;
      color: #0f172a;
    }
    
    .toast-container.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    /* =========================================
       レスポンシブ調整 (スマホ)
       ========================================= */
    @media (max-width: 500px) {
      .task-row-main {
        flex-direction: column;
        align-items: stretch;
      }
      .timer-section {
        justify-content: space-between;
        background: var(--bg-color);
        padding: 8px;
        border-radius: var(--radius-md);
      }
      .task-row-sub {
        flex-direction: column;
        align-items: stretch;
      }
      .task-actions {
        justify-content: flex-end;
      }
      .summary-card {
        padding: 16px;
      }
      .summary-time {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <header>
    <h1>⏱️ タイムトラッカー</h1>
    <button class="theme-toggle" id="themeBtn" aria-label="テーマ切り替え">☀️</button>
  </header>

  <!-- サマリーエリア -->
  <div class="summary-card">
    <div class="summary-label">合計作業時間</div>
    <div class="summary-time" id="displayTotalTime">00:00:00</div>
  </div>

  <!-- ツールバー -->
  <div class="toolbar">
    <div class="btn-group">
      <button class="btn-primary" id="btnAddTask">＋ 作業を追加</button>
      <button class="btn-dark" id="btnCopyResult">📋 結果をコピー</button>
    </div>
    <label class="toggle-option" title="開始ボタンを押した時、他の動いているタイマーを自動で停止します">
      <input type="checkbox" id="chkAutoPause" checked>
      <span>開始時に他を自動停止</span>
    </label>
  </div>

  <!-- タスクリスト -->
  <div class="task-list" id="taskListContainer">
    <!-- タスクカードがここに動的に生成されます -->
  </div>
</div>

<!-- モーダル (時間編集) -->
<div class="modal-overlay" id="editTimeModal">
  <div class="modal-content">
    <div class="modal-header">作業時間の直接編集</div>
    <div class="time-edit-group">
      <div class="time-input-wrap">
        <label for="inp-hours">時間</label>
        <input type="number" id="inp-hours" min="0" max="999" placeholder="00">
      </div>
      <div class="time-edit-separator">:</div>
      <div class="time-input-wrap">
        <label for="inp-minutes">分</label>
        <input type="number" id="inp-minutes" min="0" max="59" placeholder="00">
      </div>
      <div class="time-edit-separator">:</div>
      <div class="time-input-wrap">
        <label for="inp-seconds">秒</label>
        <input type="number" id="inp-seconds" min="0" max="59" placeholder="00">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="btnCancelEdit">キャンセル</button>
      <button class="btn-primary" id="btnSaveEdit">保存</button>
    </div>
  </div>
</div>

<!-- トースト通知 -->
<div class="toast-container" id="toastNotification">
  <span>✓</span>
  <span id="toastMessage">コピーしました！</span>
</div>

<script>
  /**
   * =========================================
   * アプリケーションロジック
   * =========================================
   */

  // --- 定数 & 状態管理 ---
  const STORAGE_KEY = 'v4_timeTrackerTasks';
  const SETTINGS_KEY = 'v4_timeTrackerSettings';

  // デフォルトタスク
  const defaultTasks = [
    { id: generateId(), name: '作業 1', memo: '', elapsed: 0, isRunning: false, lastStart: null }
  ];

  let tasks = loadTasks();
  let settings = loadSettings();
  
  // 編集中のタスクIDを保持
  let editingTaskId = null;
  // 定期更新のインターバルID
  let renderInterval = null;

  // --- 初期化処理 ---
  function init() {
    applyTheme(settings.theme);
    document.getElementById('chkAutoPause').checked = settings.autoPause;
    
    // アプリ起動時に、実行中だったタスクの経過時間を現在時刻で再計算
    recalculateRunningTasks();
    
    renderApp();
    startRenderLoop();
    setupEventListeners();
  }

  // --- データ読み込み / 保存 ---
  function loadTasks() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : defaultTasks;
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function loadSettings() {
    const defaultSettings = { theme: 'light', autoPause: true };
    const data = localStorage.getItem(SETTINGS_KEY);
    return data ? { ...defaultSettings, ...JSON.parse(data) } : defaultSettings;
  }

  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  }

  function generateId() {
    return Date.now() + Math.floor(Math.random() * 1000);
  }

  // --- 時間計算ロジック ---
  function recalculateRunningTasks() {
    const now = Date.now();
    tasks.forEach(t => {
      if (t.isRunning && t.lastStart) {
        t.elapsed += (now - t.lastStart);
        t.lastStart = now; // 基準時間を現在にリセット
      }
    });
    saveTasks();
  }

  function getTaskCurrentElapsed(task) {
    if (task.isRunning && task.lastStart) {
      return task.elapsed + (Date.now() - task.lastStart);
    }
    return task.elapsed;
  }

  function formatMsToTimeStr(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  // 人間が読みやすい形式（コピー用）
  function formatMsToReadable(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    
    const parts = [];
    if (h > 0) parts.push(`${h}時間`);
    if (m > 0 || h > 0) parts.push(`${m}分`);
    parts.push(`${s}秒`);
    return parts.join('');
  }

  function escapeHTML(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // --- レンダリング処理 ---
  function renderApp() {
    const container = document.getElementById('taskListContainer');
    // 現在のフォーカス要素を記憶
    const activeElement = document.activeElement;
    const activeDatasetId = activeElement ? activeElement.dataset.id : null;
    const activeClass = activeElement ? activeElement.className : null;

    let html = '';
    let totalMs = 0;

    tasks.forEach(task => {
      const currentElapsed = getTaskCurrentElapsed(task);
      totalMs += currentElapsed;
      const isRun = task.isRunning;

      html += `
        <div class="task-card ${isRun ? 'is-running' : ''}" data-id="${task.id}">
          
          <div class="task-row-main">
            <input type="text" 
                   class="input-task-name" 
                   value="${escapeHTML(task.name)}" 
                   data-id="${task.id}" 
                   placeholder="作業名（例：資料作成）">
            
            <div class="timer-section">
              ${isRun ? `
                <div class="running-badge">
                  <span class="pulse-dot"></span> 計測中
                </div>
              ` : ''}
              
              <div class="time-display" data-action="edit" data-id="${task.id}" title="クリックで時間を直接編集">
                ${formatMsToTimeStr(currentElapsed)}
              </div>
              
              <button class="btn-start" data-action="start" data-id="${task.id}" ${isRun ? 'disabled' : ''}>
                ▶ 開始
              </button>
              <button class="btn-stop" data-action="stop" data-id="${task.id}" ${!isRun ? 'disabled' : ''}>
                ■ 停止
              </button>
            </div>
          </div>

          <div class="task-row-sub">
            <input type="text" 
                   class="input-task-memo" 
                   value="${escapeHTML(task.memo || '')}" 
                   data-id="${task.id}" 
                   placeholder="作業内容やメモを追加（自動保存）">
            
            <div class="task-actions">
              <button class="btn-icon" data-action="edit" data-id="${task.id}" title="時間を編集">✏️</button>
              <button class="btn-icon" data-action="reset" data-id="${task.id}" title="0にリセット">🔄</button>
              <button class="btn-icon danger" data-action="delete" data-id="${task.id}" title="作業を削除">🗑️</button>
            </div>
          </div>

        </div>
      `;
    });

    container.innerHTML = html;
    document.getElementById('displayTotalTime').innerText = formatMsToTimeStr(totalMs);

    // フォーカスを復元（入力中に再描画されてもカーソルが外れないようにする）
    if (activeDatasetId && activeClass) {
      const el = container.querySelector(`.${activeClass.split(' ')[0]}[data-id="${activeDatasetId}"]`);
      if (el) {
        // valueを再設定してカーソルを末尾へ
        const val = el.value;
        el.value = '';
        el.focus();
        el.value = val;
      }
    }
  }

  // タイマー駆動
  function startRenderLoop() {
    if (renderInterval) clearInterval(renderInterval);
    renderInterval = setInterval(() => {
      // 実行中のタスクが1つでもあれば再描画
      if (tasks.some(t => t.isRunning)) {
        renderApp();
      }
    }, 1000);
  }

  // --- アクション処理 ---
  function startTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    // 自動停止がオンの場合、他のタスクをすべて停止
    if (settings.autoPause) {
      const now = Date.now();
      tasks.forEach(t => {
        if (t.id !== id && t.isRunning) {
          t.elapsed += (now - t.lastStart);
          t.isRunning = false;
          t.lastStart = null;
        }
      });
    }

    if (!task.isRunning) {
      task.isRunning = true;
      task.lastStart = Date.now();
    }
    
    saveTasks();
    renderApp();
  }

  function stopTask(id) {
    const task = tasks.find(t => t.id === id);
    if (task && task.isRunning) {
      task.elapsed += (Date.now() - task.lastStart);
      task.isRunning = false;
      task.lastStart = null;
      saveTasks();
      renderApp();
    }
  }

  function resetTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;
    
    if (confirm(`「${task.name}」の作業時間を 00:00:00 にリセットしますか？`)) {
      task.elapsed = 0;
      if (task.isRunning) {
        task.lastStart = Date.now();
      }
      saveTasks();
      renderApp();
    }
  }

  function deleteTask(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    if (confirm(`「${task.name}」を完全に削除してもよろしいですか？`)) {
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderApp();
    }
  }

  function addNewTask() {
    tasks.push({
      id: generateId(),
      name: `作業 ${tasks.length + 1}`,
      memo: '',
      elapsed: 0,
      isRunning: false,
      lastStart: null
    });
    saveTasks();
    renderApp();
  }

  // --- イベントリスナー設定 ---
  function setupEventListeners() {
    
    // テーマ切り替え
    document.getElementById('themeBtn').addEventListener('click', () => {
      settings.theme = settings.theme === 'light' ? 'dark' : 'light';
      applyTheme(settings.theme);
      saveSettings();
    });

    // 自動停止トグル
    document.getElementById('chkAutoPause').addEventListener('change', (e) => {
      settings.autoPause = e.target.checked;
      saveSettings();
    });

    // 追加ボタン
    document.getElementById('btnAddTask').addEventListener('click', addNewTask);

    // コピーボタン
    document.getElementById('btnCopyResult').addEventListener('click', copyToClipboard);

    // タスクリスト内のイベント委譲
    const container = document.getElementById('taskListContainer');
    
    // 入力イベント（自動保存）
    container.addEventListener('input', (e) => {
      const target = e.target;
      const id = Number(target.dataset.id);
      if (!id) return;
      
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      if (target.classList.contains('input-task-name')) {
        task.name = target.value;
        saveTasks();
      } else if (target.classList.contains('input-task-memo')) {
        task.memo = target.value;
        saveTasks();
      }
    });

    // クリックイベント（ボタン系）
    container.addEventListener('click', (e) => {
      // time-displayのようなdivにもdata-actionをつけるため closest を使用
      const actionEl = e.target.closest('[data-action]');
      if (!actionEl) return;

      const action = actionEl.dataset.action;
      const id = Number(actionEl.dataset.id);

      if (action === 'start') startTask(id);
      if (action === 'stop') stopTask(id);
      if (action === 'reset') resetTask(id);
      if (action === 'delete') deleteTask(id);
      if (action === 'edit') openEditModal(id);
    });

    // モーダルイベント
    document.getElementById('btnCancelEdit').addEventListener('click', closeEditModal);
    document.getElementById('btnSaveEdit').addEventListener('click', saveEditedTime);
    
    // 背景クリックでモーダル閉じる
    document.getElementById('editTimeModal').addEventListener('click', (e) => {
      if (e.target.id === 'editTimeModal') closeEditModal();
    });

    // ブラウザを閉じる直前に正確な時間を記録
    window.addEventListener('beforeunload', () => {
      recalculateRunningTasks();
    });
    
    // ページがバックグラウンドから復帰した際に再計算＆再描画
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        renderApp();
      }
    });
  }

  // --- テーマ処理 ---
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').innerText = theme === 'light' ? '🌙' : '☀️';
  }

  // --- モーダル（時間編集）処理 ---
  function openEditModal(id) {
    const task = tasks.find(t => t.id === id);
    if (!task) return;

    editingTaskId = id;
    const currentMs = getTaskCurrentElapsed(task);
    const totalSec = Math.floor(currentMs / 1000);
    
    document.getElementById('inp-hours').value = Math.floor(totalSec / 3600);
    document.getElementById('inp-minutes').value = Math.floor((totalSec % 3600) / 60);
    document.getElementById('inp-seconds').value = totalSec % 60;
    
    document.getElementById('editTimeModal').classList.add('show');
  }

  function closeEditModal() {
    document.getElementById('editTimeModal').classList.remove('show');
    editingTaskId = null;
  }

  function saveEditedTime() {
    if (!editingTaskId) return;
    const task = tasks.find(t => t.id === editingTaskId);
    if (!task) return;

    const h = parseInt(document.getElementById('inp-hours').value) || 0;
    const m = parseInt(document.getElementById('inp-minutes').value) || 0;
    const s = parseInt(document.getElementById('inp-seconds').value) || 0;
    
    // 制約を設ける
    const safeH = Math.max(0, h);
    const safeM = Math.max(0, Math.min(59, m));
    const safeS = Math.max(0, Math.min(59, s));
    
    const newMs = (safeH * 3600 + safeM * 60 + safeS) * 1000;
    
    task.elapsed = newMs;
    // 計測中だった場合は、今の時間を新しい基準点にする
    if (task.isRunning) {
      task.lastStart = Date.now();
    }
    
    saveTasks();
    renderApp();
    closeEditModal();
  }

  // --- コピー機能（フォーマット整形） ---
  function copyToClipboard() {
    // 実行中のタスクがあれば計算を合わせる
    recalculateRunningTasks();

    let totalMs = 0;
    const now = new Date();
    const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;

    const lines = [];
    lines.push(`📋 【作業実績レポート】 ${dateStr}`);
    lines.push(`=========================================`);

    tasks.forEach(task => {
      const ms = task.elapsed;
      totalMs += ms;
      
      const timeStr = formatMsToTimeStr(ms);
      const readable = formatMsToReadable(ms);
      const taskName = task.name.trim() || '名称未設定';
      
      lines.push(`■ ${taskName} :  ${timeStr} (${readable})`);
      if (task.memo && task.memo.trim() !== '') {
        // メモに改行が含まれている場合のインデント処理
        const memoLines = task.memo.trim().split('\n');
        lines.push(`   内容 : ${memoLines[0]}`);
        for(let i = 1; i < memoLines.length; i++){
           lines.push(`          ${memoLines[i]}`);
        }
      }
      lines.push(`- - - - - - - - - - - - - - - - - - - - -`);
    });

    // 最後の不要な破線を消す
    if(tasks.length > 0) lines.pop(); 

    lines.push(`=========================================`);
    lines.push(`【合計作業時間】 ${formatMsToTimeStr(totalMs)} (${formatMsToReadable(totalMs)})`);

    const textToCopy = lines.join('\n');

    navigator.clipboard.writeText(textToCopy)
      .then(() => showToast('作業記録を見やすく整形してコピーしました！'))
      .catch(err => {
        console.error('コピーに失敗しました', err);
        showToast('コピーに失敗しました。');
      });
  }

  // --- トースト通知 ---
  function showToast(message) {
    const toast = document.getElementById('toastNotification');
    document.getElementById('toastMessage').innerText = message;
    
    toast.classList.add('show');
    
    // 重複呼び出し対策
    if(window.toastTimeout) clearTimeout(window.toastTimeout);
    window.toastTimeout = setTimeout(() => {
      toast.classList.remove('show');
    }, 2500);
  }

  // --- 起動 ---
  init();

</script>
</body>
</html>
